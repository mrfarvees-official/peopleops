# Temporary HTTP-only site, used by deploy.sh only to obtain the first certificate
# (nginx.conf cannot load until the certificate files exist).
server {
    listen 80;
    listen [::]:80;
    server_name peopleops.farvees.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "PeopleOps is being deployed\n";
    }
}
