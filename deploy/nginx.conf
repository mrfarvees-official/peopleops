# Nginx site for PeopleOps (HTTPS). deploy.sh installs this file; to do it by hand:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/peopleops
#   sudo ln -sf /etc/nginx/sites-available/peopleops /etc/nginx/sites-enabled/peopleops
#   sudo nginx -t && sudo systemctl reload nginx
# The certificate must exist first (deploy.sh obtains it with certbot, see nginx-bootstrap.conf).

upstream peopleops_app {
    server 127.0.0.1:3003;
    keepalive 16;
}

# HTTP: certificate challenges, everything else goes to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name peopleops.farvees.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peopleops.farvees.xyz;

    ssl_certificate     /etc/letsencrypt/live/peopleops.farvees.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peopleops.farvees.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;   # table imports are limited to 10 MB

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location / {
        proxy_pass http://peopleops_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
